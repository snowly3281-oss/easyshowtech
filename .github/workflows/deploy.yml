name: Deploy EasyShowTech

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Deploy Sanity Studio
  # ==========================================
  deploy-sanity:
    name: Deploy Sanity Studio
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./studio/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Deploy Sanity Studio
        run: npx sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}


  # ==========================================
  # 2. Build and Deploy Astro to Cloudflare Worker
  # ==========================================
  deploy-workers:
    name: Build and Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: deploy-sanity

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm


      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm install


      # ----------------------------------------
      # Build Astro
      # ----------------------------------------
      - name: Build Astro
        run: npm run build


      # ----------------------------------------
      # Verify Astro Worker build
      # ----------------------------------------
      - name: Verify Worker build
        run: |
          echo "Checking Astro build output..."
          test -f dist/server/entry.mjs
          test -f dist/server/wrangler.json

          echo ""
          echo "=== dist/server ==="
          ls -la dist/server

          echo ""
          echo "=== Generated Wrangler config ==="
          cat dist/server/wrangler.json


      # ----------------------------------------
      # Deploy Cloudflare Worker
      # ----------------------------------------
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}