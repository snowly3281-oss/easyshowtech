name: Deploy EasyShowTech
run-name: Publish ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-content-published]

permissions:
  contents: read

# Finish a release before starting the next one; never interrupt a partial deploy.
concurrency:
  group: easyshowtech-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_SANITY_PROJECT_ID: w8rk6k6z
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SITE_INDEXING_ENABLED: 'true'
      PUBLIC_DEPLOY_COMMIT: ${{ github.sha }}
      PUBLIC_DEPLOY_RUN_ID: ${{ github.run_id }}
      # Prefer a dedicated Viewer token. The already-configured Studio deployment
      # credential keeps existing installations working until that token is added.
      # This variable is server-only; never use a PUBLIC_ prefix for it.
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN || secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Use the project npm version
        run: npm install --global npm@10.9.2
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix studio --no-audit --no-fund
      - name: Test deployment checks
        run: npm run test:deployment
      - name: Refuse empty or inaccessible published content
        run: npm run content:check
      - name: Build the website and Studio before publishing either
        run: |
          npm run build
          npm --prefix studio run build
      - name: Verify the deployment artifact
        run: |
          test -f dist/server/entry.mjs
          test -f dist/server/wrangler.json
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("dist/client/deployment.json", "utf8")); if(m.commit!==process.env.PUBLIC_DEPLOY_COMMIT || m.runId!==process.env.PUBLIC_DEPLOY_RUN_ID) process.exit(1)'
      - name: Deploy Sanity Studio
        working-directory: studio
        run: npx sanity deploy --no-build --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      - name: Deploy Cloudflare Worker and its built assets
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the actual public domain serves this release
        run: node scripts/deployment.mjs verify "$PUBLIC_DEPLOY_COMMIT" "$PUBLIC_DEPLOY_RUN_ID"
      - name: Record the production version
        if: success()
        run: |
          echo "Published commit: $PUBLIC_DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://easyshowtech.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "Version marker: https://easyshowtech.com/deployment.json" >> "$GITHUB_STEP_SUMMARY"
